<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Atiq CRM — Garment Costing &amp; Profitability</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #111c2d;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #1a283e;
      border: 1px solid #283a54;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .logo-badge {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #c58b4b, #9e6932);
      color: white;
      font-weight: 800;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 4px 12px rgba(197, 139, 75, 0.4);
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    p {
      color: #8c9cb3;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(197, 139, 75, 0.2);
      border-top-color: #c58b4b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 12px;
      font-weight: 600;
      color: #c58b4b;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #c58b4b;
      color: white;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn:hover { background: #b0783b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">A</div>
    <h1>Atiq CRM</h1>
    <p>Garment Costing &amp; Profitability Engine for Manufacturing &amp; Marketplace Brands</p>
    
    <div class="spinner"></div>
    <div class="status-text" id="status">Connecting to Atiq CRM core...</div>

    <button class="btn" onclick="window.location.reload()">Reload Application</button>
  </div>

  <script>
    // If Capacitor server URL or live host is configured, redirect automatically
    const targetUrl = localStorage.getItem('atiq_server_url') || '';
    if (targetUrl) {
      document.getElementById('status').innerText = 'Connecting to ' + targetUrl + '...';
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 500);
    }
  </script>
</body>
</html>
